[package]
name = "app-desktop"
version = "2.0.0"
description = "Total Stock: inventario, ventas y clientes"
authors = ["Jean Pierre"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libsql = "0.10.0"
tokio = { version = "1", features = ["sync"] }
rust_xlsxwriter = "0.102.0"
tauri-plugin-dialog = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }


# Sin información de depuración en modo desarrollo: no hace falta para probar la app (los errores
# siguen mostrando el nombre de la función) y con ella el APK de prueba de Android pesa ~400 MB.
[profile.dev]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
